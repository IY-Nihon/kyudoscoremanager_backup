name: Daily Firestore Backup

on:
  schedule:
    - cron: '0 15 * * *' # 毎日 深夜0時 JST (= UTC 15:00)
  workflow_dispatch: # 手動実行ボタン
  # 外部からのPull Requestではワークフローを起動しない
  # （悪意あるPRがSecretsを盗もうとする攻撃を防ぐ）
  # push/schedule/workflow_dispatch のみが有効なトリガー

permissions:
  contents: read  # actions/checkout がリポジトリを読み取るために必要

concurrency:
  group: backup
  cancel-in-progress: false  # 実行中のバックアップを中断しない

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # フォークからのPRではこのジョブを実行しない（Secrets漏洩対策）
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-backup-firebase-admin-12
          restore-keys: |
            ${{ runner.os }}-backup-

      # バージョンを固定して予期しないアップデートを防ぐ
      - name: 📦 Install backup dependencies
        run: npm install --no-save firebase-admin@12

      - name: 🔥 Run Firestore backup
        id: backup
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/backup-firestore.mjs

      - name: 🔍 Verify backup integrity
        id: verify
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        continue-on-error: true
        run: node scripts/verify-exact.mjs

      # ■ なぜ暗号化するか
      # このリポジトリは公開している。GitHub の成果物は「リポジトリを読める人」
      # がダウンロードでき、公開リポジトリではそれは全世界のログイン済み利用者
      # を指す（管理権限は要らない）。2026-09-03 に、管理権限を持たない別アカ
      # ウントから一覧・サイズ・ダウンロード導線が見えることを実際に確かめた。
      #
      # 中身は本番の Firestore・RTDB・Firebase Auth で、利用者のメールアドレスと
      # パスワードのハッシュ・salt を含む。素のままでは置けないので、鍵が無ければ
      # 読めない形にしてから上げる。
      #
      # 照合（verify）は素のファイルを読むので、その後に暗号化する。
      - name: 🔐 Encrypt backup
        if: steps.backup.outcome == 'success'
        env:
          KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::BACKUP_ENCRYPTION_KEY が設定されていません。"
            echo "素のバックアップを公開の場へ上げないため、ここで止めます。"
            echo "リポジトリの Settings → Secrets and variables → Actions で設定してください。"
            exit 1
          fi
          shopt -s nullglob
          files=(backup-output/*.json.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::backup-output/ に控えがありません。"
            exit 1
          fi
          for f in "${files[@]}"; do
            gpg --batch --yes --quiet --symmetric --cipher-algo AES256 \
                --passphrase "$KEY" --output "$f.gpg" "$f"
            rm -f "$f"                       # 素のファイルは残さない
          done
          echo "暗号化しました:"
          ls -l backup-output/

      # 上の段で素のファイルを消しているので、ここで上がるのは .gpg だけ。
      # 保持は90日。公開リポジトリの上限が90日で、それ以上を書いても
      # 切り詰められる（以前は 365 と書いてあり、毎回警告が出ていた）
      - name: ☁️ Upload to GitHub Artifacts
        if: steps.backup.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: backup-output/
          retention-days: 90

      # verify が差異を検出した場合、アップロード後にジョブを失敗させてメール通知を送る
      - name: ❌ Fail if verify found issues
        if: steps.verify.outcome == 'failure'
        run: |
          echo "❌ バックアップ照合で差異が検出されました。上記のログを確認してください。"
          exit 1
